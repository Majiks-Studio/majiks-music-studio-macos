[package]
name = "majiks-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
timeline-core = { path = "../timeline-core" }
contracts-conformance = { path = "../contracts/conformance" }

[[bin]]
name = "journal_reader"
path = "fuzz_targets/journal_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mstudio_loader"
path = "fuzz_targets/mstudio_loader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gen_protocol"
path = "fuzz_targets/gen_protocol.rs"
test = false
doc = false
bench = false
